<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índice - Carrito</title>
</head>
<body>
    <h1>Añadir Producto</h1>
    <form>
        <label for="producto">Producto: 
            <input type="text" id="producto" name="producto" required>
        </label>
        <br><br>
        <label for="unidades">Unidades:
            <input type="number" id="unidades" name="unidades" min="1" required>
        </label>
        <br><br>
        <button type="submit" id="btn-compra">Comprar / Añadir</button>
        <button type="button" id="btn-carrito">Ver Carrito</button>
    </form>

    <script src="codigo.js"></script>
</body>
</html>
